
<!DOCTYPE html>
<html>
<head>
<title>Quest Browser Test</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body {
  margin: 0;
  background: #15152b;
  color: white;
  font-family: Arial;
  text-align: center;
}
h1 { margin-top: 100px; }
canvas {
  background: #303050;
  border: 3px solid white;
  border-radius: 12px;
}
</style>
</head>
<body>

<h1>QUEST BROWSER TEST</h1>
<p>If you can see this, HTML is working!</p>

<canvas id="game" width="500" height="300"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let x = 50;
let speed = 3;

function draw() {
  ctx.clearRect(0,0,500,300);

  ctx.fillStyle = "red";
  ctx.beginPath();
  ctx.arc(x,150,25,0,Math.PI*2);
  ctx.fill();

  x += speed;
  if(x > 475 || x < 25) speed *= -1;

  requestAnimationFrame(draw);
}

draw();
</script>

</body>
</html>
